name: CI

# Runs on every push and pull request against main - this is what
# actually verifies the project builds, tests pass, and the Docker
# setup works, on a clean machine, automatically, every time.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Build the application jar
        run: mvn clean package -DskipTests

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t subtrack:ci .

      - name: Start services with docker-compose
        run: docker compose up -d --wait

      - name: Verify the app responds
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8080/swagger-ui.html > /dev/null; then
              echo "App is up and responding"
              exit 0
            fi
            echo "Waiting for app to start... ($i/10)"
            sleep 3
          done
          echo "App did not respond in time"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
