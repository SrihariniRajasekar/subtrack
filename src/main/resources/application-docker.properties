spring.application.name=subtrack

# PostgreSQL configuration - used only when running via docker-compose
# (activated by SPRING_PROFILES_ACTIVE=docker, set in docker-compose.yml).
# "db" below is the service name of the Postgres container, resolved via
# Docker's internal networking - not localhost, since this runs inside a container.
spring.datasource.url=jdbc:postgresql://db:5432/subtrackdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=subtrack
spring.datasource.password=subtrack

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
