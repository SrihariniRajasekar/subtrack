spring.application.name=subtrack

# H2 in-memory database - no installation needed, resets on every restart
spring.datasource.url=jdbc:h2:mem:subtrackdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create tables from entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console - lets you view the database in a browser at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
